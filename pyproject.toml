[project]
name = "cyberdeck"
version = "0.1.0"
description = "Terminal dashboard: clock, calendar, weather, spinning Earth, system monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "psutil>=5.9",
    "numpy>=1.26",
]

[project.scripts]
cyberdeck = "cyberdeck.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=10.0",
    "pytest>=8.0",
    "resvg-py>=0.5.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyberdeck"]

[tool.hatch.build]
artifacts = ["src/cyberdeck/data/*.npz"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "BLE"]
ignore = ["E501", "BLE001", "RUF012"]

