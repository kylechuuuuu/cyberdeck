[project]
name = "cyberdeck"
version = "0.1.0"
description = "Terminal dashboard: clock, calendar, weather, spinning Earth, system monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "psutil>=5.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "lunar-python>=1.4.8",
    "tzdata>=2026.5",
    "winrt-runtime>=4.0.3; sys_platform == 'win32'",
    "winrt-windows-media-control>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-windows-foundation>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2705; sys_platform == 'win32'",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
cyberdeck = "cyberdeck.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=10.0",
    "pytest>=8.0",
    "resvg-py>=0.5.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyberdeck"]

[tool.hatch.build]
artifacts = ["src/cyberdeck/data/*.npz"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "BLE"]
ignore = ["E501", "BLE001", "RUF012"]

